services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_DB: connect, POSTGRES_USER: connect, POSTGRES_PASSWORD: connect }
    ports: ["5432:5432"]
    volumes: [connect_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes: { connect_pg: {} }
