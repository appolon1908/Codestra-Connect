name: connect-ci
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/validate_foundation.py
      - run: python3 scripts/validate_mission7.py
      - run: python3 scripts/validate_sections_ab.py
