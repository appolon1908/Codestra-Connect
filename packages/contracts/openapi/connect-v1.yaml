openapi: 3.1.0
info:
  title: Codestra Connect API
  version: 0.1.0
paths:
  /health:
    get:
      operationId: health
      responses: { '200': { description: Healthy } }
  /ready:
    get:
      operationId: ready
      responses: { '200': { description: Ready } }
  /profiles:
    post:
      operationId: createProfile
      responses: { '201': { description: Created } }
  /personas:
    post:
      operationId: createPersona
      responses: { '201': { description: Created } }
  /cards:
    post:
      operationId: createCard
      responses: { '201': { description: Created } }
  /cards/{card_id}/share-tokens:
    post:
      operationId: createShareToken
      parameters:
        - { in: path, name: card_id, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8, maxLength: 255 } }
      responses: { '201': { description: Created } }
  /share-sessions/{token}/consents:
    post:
      operationId: recordConsent
      parameters:
        - { in: path, name: token, required: true, schema: { type: string, minLength: 20 } }
      responses: { '201': { description: Consent recorded } }
  /connections:
    post:
      operationId: createConnection
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8, maxLength: 255 } }
      responses: { '201': { description: Created } }
components:
  schemas:
    PersonaKind:
      type: string
      enum: [business, personal, friends_family, social_leisure, dating_private, event, travel, custom]
    DisclosureLevel:
      type: string
      enum: [public, ask_first, private, never_auto_share]
    SocialActionState:
      type: string
      enum: [requires_user_action, authorized, completed, failed, revoked, unsupported]
